name: Release

# Publish by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check tag matches Cargo.toml version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml version v$v"; exit 1; }
      - name: Test
        run: cargo test --locked
      - name: Build .deb
        run: |
          cargo build --release --locked
          cargo install cargo-deb --locked
          cargo deb --no-build
          mkdir dist
          cp target/debian/synnamon_*_amd64.deb dist/synnamon_amd64.deb
          cp install.sh dist/install.sh
          (cd dist && sha256sum synnamon_amd64.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  verify:
    name: Verify install from the published release
    needs: publish
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v4
      - name: Run install.sh against the release
        run: SYNNAMON_VERSION="${GITHUB_REF_NAME#v}" bash install.sh
      - name: Check the installed binary
        run: |
          synnamon --help
          getent passwd synnamon
