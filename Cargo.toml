[package]
name = "synnamon"
version = "0.2.0"
edition = "2024"
description = "Lightweight system monitor that alerts a webhook on low battery and logins"
license = "MIT"
repository = "https://github.com/milo-v/synnamon"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"

# HTTPS (rustls/ring) needs a C toolchain; the real target is Linux. Other
# platforms get plain-HTTP ureq so unit tests build on a bare dev machine.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
name = "synnamon"
section = "admin"
priority = "optional"
extended-description = "Watches battery level and successful SSH/local logins and sends alerts to a Discord or generic HTTP webhook. Configure with `sudo synnamon config`."
depends = "$auto, systemd"
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/synnamon", "usr/bin/", "755"],
    ["packaging/synnamon.service", "lib/systemd/system/", "644"],
    ["README.md", "usr/share/doc/synnamon/README.md", "644"],
    ["LICENSE", "usr/share/doc/synnamon/LICENSE", "644"],
]
