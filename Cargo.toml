[package]
name = "synnamon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"

# HTTPS (rustls/ring) needs a C toolchain; the real target is Linux. Other
# platforms get plain-HTTP ureq so unit tests build on a bare dev machine.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
